---
# cPanel Git deployment — runs on each "Pull or Deploy" in
# cPanel > Files > Git Version Control.
#
# Deploys app files into public_html. SQL files, seeds and the cron
# folder stay in the repo clone outside the docroot.
deployment:
  tasks:
    - export DEPLOYPATH=/home/nipangec/public_html/
    - /bin/cp -f *.php $DEPLOYPATH
    - /bin/cp -f manifest.webmanifest sw.js offline.html google*.html $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/includes $DEPLOYPATH/api $DEPLOYPATH/admin $DEPLOYPATH/assets $DEPLOYPATH/assets/icons $DEPLOYPATH/uploads
    - /bin/cp -rf includes/. $DEPLOYPATH/includes/
    - /bin/cp -rf api/. $DEPLOYPATH/api/
    - /bin/cp -rf admin/. $DEPLOYPATH/admin/
    - /bin/cp -rf assets/. $DEPLOYPATH/assets/
    - /bin/cp -f uploads/.htaccess $DEPLOYPATH/uploads/
